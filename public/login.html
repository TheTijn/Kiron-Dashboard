<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="/Assets/Kiron-Logo.svg" />
  <title>Sign in · Kiron · The Board</title>
  <link rel="stylesheet" href="/styles.css" />
  <style>
    body { display: grid; place-items: center; min-height: 100vh;
      background:
        radial-gradient(1200px 500px at 50% -10%, var(--green-tint) 0%, transparent 60%),
        var(--bg); padding: 24px; }
    .login-card {
      width: 100%; max-width: 400px; background: var(--panel);
      border: 1px solid var(--line); border-radius: var(--radius);
      box-shadow: var(--shadow-md); padding: 34px 30px;
    }
    .brand { display: flex; align-items: baseline; gap: 10px; margin-bottom: 4px; }
    .brand .word { font-size: 22px; font-weight: 800; letter-spacing: -.02em; }
    .brand .dot { color: var(--green-bright); }
    .sub { font-family: var(--font-mono); font-size: 11px; letter-spacing: .16em;
      text-transform: uppercase; color: var(--ink-3); margin-bottom: 26px; }
    .err { background: #fdf0ee; color: var(--danger); border: 1px solid rgba(192,57,43,.2);
      border-radius: var(--radius-sm); padding: 10px 12px; font-size: 13px; margin-bottom: 16px; display: none; }
    .err.show { display: block; }
    .foot { margin-top: 20px; font-size: 12px; color: var(--ink-3); text-align: center; }
  </style>
</head>
<body>
  <form class="login-card" id="login-form">
    <div class="brand"><span class="word">KIRON<span class="dot">.</span></span></div>
    <div class="sub">The Board · Intranet</div>

    <div class="err" id="error"></div>

    <label class="field">
      <span>Work email</span>
      <input type="email" id="email" autocomplete="username" required placeholder="you@kironinteractive.com" />
    </label>
    <label class="field">
      <span>Password</span>
      <input type="password" id="password" autocomplete="current-password" required placeholder="••••••••" />
    </label>

    <button class="btn btn-primary" type="submit" id="submit" style="width:100%; justify-content:center;">
      Sign in
    </button>
    <div class="foot">Kiron Interactive · internal use only</div>
  </form>

  <script src="/login.js"></script>
</body>
</html>
